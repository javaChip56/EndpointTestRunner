name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ApiTestRunner.sln

      - name: Build
        run: dotnet build ApiTestRunner.sln -c Release --no-restore

      - name: Test
        run: dotnet test ApiTestRunner.sln -c Release --no-build

  publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish app
        run: >
          dotnet publish src/ApiTestRunner.App/ApiTestRunner.App.csproj
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:PublishTrimmed=false
          -o artifacts/${{ matrix.runtime }}

      - name: Package artifact
        shell: pwsh
        run: |
          $artifactName = "ApiTestRunner-${{ matrix.runtime }}"
          Compress-Archive -Path "artifacts/${{ matrix.runtime }}/*" -DestinationPath "artifacts/$artifactName.zip"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime }}
          path: artifacts/ApiTestRunner-${{ matrix.runtime }}.zip

  create-release:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*.zip
          generate_release_notes: true
