targetEnvironments:
  - Local

endpoints:
  - name: Login
    method: POST
    path: /sample-api/auth/login
    headers:
      Content-Type: application/json
      X-Test-Source: sample-suite
    body:
      username: testuser
      password: password123
    tests:
      - name: Login should succeed
        expectedStatus: 200
        assertions:
          - field: success
            equals: true
          - field: message
            containsText: success
          - field: data.token
            type: string
            notEmpty: true
          - field: data.user
            type: object
