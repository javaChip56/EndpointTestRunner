<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API Test Runner</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <div>
                <p class="eyebrow">Embedded dashboard</p>
                <h1>YAML-driven API test runner</h1>
                <p class="subtitle">Runs the configured suite, evaluates JSON assertions, and keeps the latest pass/fail snapshot local.</p>
            </div>
            <div class="hero-actions">
                <button id="runButton" class="primary-button">Run Tests</button>
                <button id="refreshButton" class="ghost-button">Refresh</button>
            </div>
        </header>

        <section class="summary-grid" id="summaryGrid">
            <article class="summary-card">
                <span>Total tests</span>
                <strong id="totalTests">-</strong>
            </article>
            <article class="summary-card">
                <span>Passed</span>
                <strong id="passedTests">-</strong>
            </article>
            <article class="summary-card">
                <span>Failed</span>
                <strong id="failedTests">-</strong>
            </article>
            <article class="summary-card">
                <span>Duration</span>
                <strong id="totalDuration">-</strong>
            </article>
        </section>

        <section class="status-panel">
            <div>
                <h2>Run status</h2>
                <p id="runStatus">Waiting for the first test run.</p>
            </div>
            <div class="timestamps">
                <span id="startedAt">Started: -</span>
                <span id="completedAt">Completed: -</span>
            </div>
        </section>

        <main id="environmentContainer" class="environment-container"></main>
    </div>

    <template id="environmentTemplate">
        <section class="environment-card">
            <header class="environment-header">
                <div>
                    <h3 class="environment-name"></h3>
                    <p class="environment-url"></p>
                </div>
                <span class="environment-badge"></span>
            </header>
            <div class="endpoint-list"></div>
        </section>
    </template>

    <template id="endpointTemplate">
        <article class="endpoint-card">
            <header class="endpoint-header">
                <div>
                    <h4 class="endpoint-name"></h4>
                    <p class="endpoint-meta"></p>
                </div>
                <span class="endpoint-badge"></span>
            </header>
            <div class="test-list"></div>
            <details class="response-panel">
                <summary>Response preview</summary>
                <pre class="response-body"></pre>
            </details>
        </article>
    </template>

    <template id="testTemplate">
        <section class="test-card">
            <div class="test-title-row">
                <strong class="test-name"></strong>
                <span class="test-badge"></span>
            </div>
            <p class="test-status-line"></p>
            <ul class="assertion-list"></ul>
        </section>
    </template>

    <script src="/app.js"></script>
</body>
</html>
